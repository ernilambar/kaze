name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS arm64
    # Only Apple silicon is supported. scripts/bundle.sh re-checks the hardware
    # and the produced binary's architecture, so a misconfigured runner fails
    # instead of shipping an unusable Intel build.
    runs-on: macos-15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Check tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version lives in build/config.yml, which also feeds the bundle's
          # Info.plist. A tag that disagrees must not publish.
          . scripts/config.sh
          version="$(read_info version)"
          if [ -z "$version" ]; then
            echo "build/config.yml has no info.version" >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match build/config.yml version $version" >&2
            exit 1
          fi
          app_name="$(read_info productName)"
          if [ -z "$app_name" ]; then
            echo "build/config.yml has no info.productName" >&2
            exit 1
          fi
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Build
        run: ./scripts/bundle.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$APP_NAME-macos-arm64.zip"
          # The body is only "app name - version"; release notes live in the
          # changelog file and are edited there after publishing.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$APP_NAME - $GITHUB_REF_NAME" \
            "dist/$archive" dist/SHA256SUMS
